<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Oberstufe.site</title>
    <link rel="stylesheet" href="css/style.css">
    <script src="https://identity.netlify.com/v1/netlify-identity-widget.js"></script>
</head>
<body>
    <header>
        <nav class="navbar">
            <div class="nav-brand">
                <h1>Oberstufe.site</h1>
            </div>
            <ul class="nav-menu">
                <li class="nav-item">
                    <a href="index.html" class="nav-link active">Startseite</a>
                </li>
                <li class="nav-item">
                    <a href="about.html" class="nav-link">Über uns</a>
                </li>
                <li class="nav-item">
                    <a href="contact.html" class="nav-link">Kontakt</a>
                </li>
            </ul>
            <div class="hamburger">
                <span class="bar"></span>
                <span class="bar"></span>
                <span class="bar"></span>
            </div>
        </nav>
    </header>

    <main>
        <section class="hero">
            <div class="hero-content">
                <h2>Willkommen in der Oberstufe</h2>
                <p>Dein Begleiter durch die letzten Schuljahre</p>
            </div>
        </section>

        <section class="cards-section">
            <div class="container">
                <h2>Unsere Angebote</h2>
                <div class="cards-grid" id="cards-container">
                    <!-- Cards werden hier dynamisch eingefügt -->
                </div>
            </div>
        </section>
    </main>

    <footer>
        <div class="footer-content">
            <p>&copy; 2023 Oberstufe.site. Alle Rechte vorbehalten.</p>
        </div>
    </footer>

    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="js/scroll-effect.js"></script>
    <script src="js/main.js"></script>
    <script>
        if (window.netlifyIdentity) {
            window.netlifyIdentity.on("init", user => {
                if (!user) {
                    window.netlifyIdentity.on("login", () => {
                        document.location.href = "/admin/";
                    });
                }
            });
        }
    </script>
</body>
</html>
